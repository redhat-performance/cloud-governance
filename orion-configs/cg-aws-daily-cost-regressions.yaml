# Orion regression-detection config for AWS per-account daily cost, read
# directly from cloud-governance-cost-explorer-perf-global-cost - no separate
# rollup or destination index. "account" is a real AWS account name
# (PSAP/PERFSCALE/PERF-DEPT), not a cost-center synthetic id - see
# cg-cost-regressions.yaml for that series.
#
# The source index stores the same daily spend duplicated ~28 ways (14 tags x
# 2 savings_plan values); cloud_governance/policy/aws/cost_explorer.py writes
# orion_uuid = "<ACCOUNT>-<date>" only on the canonical (tag=purchasetype,
# savings_plan=include) rows, so uuid_field below naturally groups and sums
# only those rows per day - everything else has no orion_uuid and can't match.
#
# metadata must also filter on tag/savings_plan (not just account): Orion's
# uuid-resolution step reads source[uuid_field] with no default, so any
# metadata-matched doc without orion_uuid set would raise a KeyError.
#
# Increase only - a decrease in AWS spend isn't something that needs a
# Slack alert.
#
# threshold: 33 is a starting value from historical volatility analysis, not
# yet validated against live Orion output (see the epic's backfill/tuning
# step). Chosen because almost all statistically-significant change points in
# the historical data already exceed 30% - very little happens between 0-30%,
# so 33 catches close to everything real without much added noise.
#
# Invoke once per AWS account, e.g.:
#   orion --es-server=<opensearch-url> \
#         --benchmark-index=cloud-governance-cost-explorer-perf-global-cost \
#         --metadata-index=cloud-governance-cost-explorer-perf-global-cost \
#         --hunter-analyze \
#         --input-vars='{"account": "<PSAP|PERFSCALE|PERF-DEPT>"}' \
#         --config cg-aws-daily-cost-regressions.yaml
tests:
  - name: totalCostIncrease
    uuid_field: orion_uuid
    metadata:
      account.keyword: "{{ account }}"
      tag.keyword: purchasetype
      savings_plan.keyword: include
    metrics:
      - name: totalCostIncrease
        metric_of_interest: Cost
        agg:
          agg_type: sum
        direction: 1
        threshold: 33
