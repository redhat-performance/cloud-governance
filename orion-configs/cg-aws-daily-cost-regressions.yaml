# AWS per-account daily cost regression, read directly from
# cloud-governance-cost-explorer-perf-global-cost. orion_uuid is written by
# cost_explorer.py only on canonical (tag=purchasetype, savings_plan=include)
# rows - metadata must filter on tag/savings_plan too, or Orion's uuid
# resolution will KeyError on matched rows that lack orion_uuid.
#
# Increase only. threshold: 50, re-derived via sliding-window analysis over
# the 45d lookback (the full-history calibration that gave 33 doesn't
# transfer directly to a windowed read) - still a starting point, pending
# live tuning.
#
# Invoke once per AWS account, e.g.:
#   orion --es-server=<opensearch-url> \
#         --benchmark-index=cloud-governance-cost-explorer-perf-global-cost \
#         --metadata-index=cloud-governance-cost-explorer-perf-global-cost \
#         --hunter-analyze \
#         --input-vars='{"account": "<PSAP|PERFSCALE|PERF-DEPT>"}' \
#         --config cg-aws-daily-cost-regressions.yaml
tests:
  - name: totalCostIncrease
    uuid_field: orion_uuid
    metadata:
      account.keyword: "{{ account }}"
      tag.keyword: purchasetype
      savings_plan.keyword: include
    metrics:
      - name: totalCostIncrease
        metric_of_interest: Cost
        agg:
          agg_type: sum
        direction: 1
        threshold: 50
