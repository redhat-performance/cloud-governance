# Orion regression-detection config for the metrics produced by
# cloud_governance/policy/common_policies/orion_aws_cost_metrics_rollup.py.
# One document per AWS account per day; "account" here is a real AWS account
# name (PSAP/PERFSCALE/PERF-DEPT), not a cost-center synthetic id - see
# cg-cost-regressions.yaml for that series. Both share the same destination
# index (cloud-governance-orion-cost-metrics-index).
#
# Each metric gets its own top-level test entry, not multiple metrics under
# one shared test.
#
# Increase only - a decrease in AWS spend isn't something that needs a
# Slack alert.
#
# threshold: 33 is a starting value from historical volatility analysis, not
# yet validated against live Orion output (see the epic's backfill/tuning
# step). Chosen because almost all statistically-significant change points in
# the historical data already exceed 30% - very little happens between 0-30%,
# so 33 catches close to everything real without much added noise.
#
# Invoke once per AWS account, e.g.:
#   orion --es-server=<opensearch-url> \
#         --benchmark-index=cloud-governance-orion-cost-metrics-index \
#         --metadata-index=cloud-governance-orion-cost-metrics-index \
#         --hunter-analyze \
#         --input-vars='{"account": "<PSAP|PERFSCALE|PERF-DEPT>"}' \
#         --config cg-aws-daily-cost-regressions.yaml
tests:
  - name: totalCostIncrease
    metadata:
      account.keyword: "{{ account }}"
    metrics:
      - name: totalCostIncrease
        metric_of_interest: total_cost
        direction: 1
        threshold: 33
