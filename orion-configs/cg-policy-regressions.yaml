# Orion regression-detection config for the metrics produced by
# cloud_governance/policy/common_policies/orion_metrics_rollup.py (cloud-governance-orion-metrics-index).
#
# Each metric gets its own top-level test entry, not multiple metrics under
# one shared test: confirmed live (against real production data) that Orion
# only resolves the "value" field correctly for the first metric in a given
# test block - every metric after the first comes back null, even though it
# is still analyzed. One metric per test avoids this entirely (same fix
# already applied to cg-cost-regressions.yaml).
#
# Invoke once per account, e.g.:
#   orion --es-server=<opensearch-url> \
#         --benchmark-index=cloud-governance-orion-metrics-index \
#         --metadata-index=cloud-governance-orion-metrics-index \
#         --hunter-analyze \
#         --input-vars='{"account": "<ACCOUNT_NAME>"}' \
#         --config cg-policy-regressions.yaml
tests:
  - name: zombieClusterResourceCountIncrease
    metadata:
      account.keyword: "{{ account }}"
    metrics:
      - name: zombieClusterResourceCountIncrease
        metric_of_interest: zombie_cluster_resource_count
        direction: 1
        threshold: 20

  - name: zombieClusterResourceCountDecrease
    metadata:
      account.keyword: "{{ account }}"
    metrics:
      - name: zombieClusterResourceCountDecrease
        metric_of_interest: zombie_cluster_resource_count
        direction: -1
        threshold: 20

  - name: s3InactiveCountIncrease
    metadata:
      account.keyword: "{{ account }}"
    metrics:
      - name: s3InactiveCountIncrease
        metric_of_interest: s3_inactive_count
        direction: 1
        threshold: 20

  - name: s3InactiveCountDecrease
    metadata:
      account.keyword: "{{ account }}"
    metrics:
      - name: s3InactiveCountDecrease
        metric_of_interest: s3_inactive_count
        direction: -1
        threshold: 20

  - name: ec2StopCountIncrease
    metadata:
      account.keyword: "{{ account }}"
    metrics:
      - name: ec2StopCountIncrease
        metric_of_interest: ec2_stop_count
        direction: 1
        threshold: 20

  - name: ec2StopCountDecrease
    metadata:
      account.keyword: "{{ account }}"
    metrics:
      - name: ec2StopCountDecrease
        metric_of_interest: ec2_stop_count
        direction: -1
        threshold: 20

  - name: unusedAccessKeyCountIncrease
    metadata:
      account.keyword: "{{ account }}"
    metrics:
      - name: unusedAccessKeyCountIncrease
        metric_of_interest: unused_access_key_count
        direction: 1
        threshold: 20

  - name: unusedAccessKeyCountDecrease
    metadata:
      account.keyword: "{{ account }}"
    metrics:
      - name: unusedAccessKeyCountDecrease
        metric_of_interest: unused_access_key_count
        direction: -1
        threshold: 20

  - name: deleteAccessKeyCountIncrease
    metadata:
      account.keyword: "{{ account }}"
    metrics:
      - name: deleteAccessKeyCountIncrease
        metric_of_interest: delete_access_key_count
        direction: 1
        threshold: 20

  - name: deleteAccessKeyCountDecrease
    metadata:
      account.keyword: "{{ account }}"
    metrics:
      - name: deleteAccessKeyCountDecrease
        metric_of_interest: delete_access_key_count
        direction: -1
        threshold: 20

  - name: monitoredPoliciesSavingsIncrease
    metadata:
      account.keyword: "{{ account }}"
    metrics:
      - name: monitoredPoliciesSavingsIncrease
        metric_of_interest: monitored_policies_savings
        direction: 1
        threshold: 50

  - name: monitoredPoliciesSavingsDecrease
    metadata:
      account.keyword: "{{ account }}"
    metrics:
      - name: monitoredPoliciesSavingsDecrease
        metric_of_interest: monitored_policies_savings
        direction: -1
        threshold: 50
